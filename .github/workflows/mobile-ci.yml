name: Mobile fork Windows checks

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.repository == 'lingmulongtai/Win-CodexBar-Mobile-Connect'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable stable release source
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./scripts/release-preflight.ps1 -Repository 'lingmulongtai/Win-CodexBar-Mobile-Connect' -Tag $env:GITHUB_REF_NAME -Sha $env:GITHUB_SHA
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop-tauri/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml
      - name: Rust checks
        shell: pwsh
        run: |
          # Runner TEMP may use RUNNER~1 while path resolvers return runneradmin.
          # Give temporary-path fixtures one consistent directory spelling.
          $testTemp = Join-Path $env:RUNNER_TEMP 'codexbar-tests'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/release-pipeline.tests.ps1
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frontend checks
        working-directory: apps/desktop-tauri
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run --maxWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable Windows EXE
        working-directory: apps/desktop-tauri
        shell: pwsh
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          pnpm run tauri:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare verified stable EXE assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item target/release/codexbar-desktop-tauri.exe release-assets/Win-CodexBar-Mobile-Connect.exe
          ./scripts/verify-mobile-exe.ps1 -Path release-assets/Win-CodexBar-Mobile-Connect.exe -Version $env:GITHUB_REF_NAME.Substring(1)
          Copy-Item LICENSE release-assets/LICENSE.txt
          $hash = (Get-FileHash release-assets/Win-CodexBar-Mobile-Connect.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{ repository=$env:GITHUB_REPOSITORY; tag=$env:GITHUB_REF_NAME; commit=$env:GITHUB_SHA; version=$env:GITHUB_REF_NAME.Substring(1); workflowRun=$env:GITHUB_RUN_ID; file='Win-CodexBar-Mobile-Connect.exe'; sha256=$hash; authenticodeSigned=$false; architecture='x64'; minimumWindows='Windows 10'; webView2Required=$true } |
            ConvertTo-Json | Set-Content release-assets/build-provenance.json -Encoding utf8NoBOM
          $manifest = Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          [IO.File]::WriteAllText('release-assets/SHA256SUMS', ($manifest -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: mobile-connect-stable-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Win-CodexBar-Mobile-unsigned-${{ github.sha }}
          path: target/release/codexbar-desktop-tauri.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.repository == 'lingmulongtai/Win-CodexBar-Mobile-Connect' && startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mobile-connect-stable-${{ github.sha }}
          path: release-assets
      - name: Verify downloaded EXE and build provenance
        shell: pwsh
        run: |
          $provenance = Get-Content release-assets/build-provenance.json -Raw | ConvertFrom-Json
          $hash = (Get-FileHash release-assets/Win-CodexBar-Mobile-Connect.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($provenance.commit -ne $env:GITHUB_SHA -or $provenance.repository -ne $env:GITHUB_REPOSITORY -or $provenance.tag -ne $env:GITHUB_REF_NAME -or $provenance.sha256 -ne $hash) { throw 'Downloaded EXE provenance does not match the immutable source.' }
          ./scripts/verify-mobile-exe.ps1 -Path release-assets/Win-CodexBar-Mobile-Connect.exe -Version $env:GITHUB_REF_NAME.Substring(1)
      - name: Publish stable latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_tag() {
            local actual
            actual="$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" | cut -f1)"
            if [ -z "$actual" ]; then actual="$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" | cut -f1)"; fi
            [ "$actual" = "$GITHUB_SHA" ] || { echo 'Release tag moved away from the verified build commit.' >&2; exit 1; }
          }
          verify_tag
          (cd release-assets && sha256sum --check SHA256SUMS)
          bash scripts/gh-safe.sh --repo lingmulongtai/Win-CodexBar-Mobile-Connect --verify-kind repo -- release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --target "$GITHUB_SHA" --latest --title "Win-CodexBar + Mobile Connect $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          verify_tag
